openapi: 3.1.0
info:
  title: UrbanFlow Notification Service API
  version: 1.0.0
  description: Paginated customer shipment-notification feed.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://notification.urbanflow.local
    description: Environment notification service
security: []
tags:
  - name: Notifications
    description: Customer-facing delivery updates
paths:
  /api/v1/customers/{customerId}/notifications:
    get:
      tags: [Notifications]
      summary: List customer notifications
      operationId: listCustomerNotifications
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Newest-first customer notification page
          headers:
            Cache-Control:
              description: Notification feeds are not stored by intermediaries.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: Invalid customer identifier or page boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Notification:
      type: object
      additionalProperties: false
      required: [id, shipmentId, type, subject, body, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        shipmentId:
          type: string
          format: uuid
        type:
          type: string
          maxLength: 80
        subject:
          type: string
          maxLength: 160
        body:
          type: string
          maxLength: 1000
        status:
          type: string
          enum: [PENDING, RETRY, DELIVERED, DEAD_LETTER]
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: [string, 'null']
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, status, path, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        path:
          type: string
        timestamp:
          type: string
          format: date-time
