openapi: 3.1.0
info:
  title: UrbanFlow Warehouse Service API
  version: 1.0.0
  description: Operational warehouses, logistics hubs, incidents, feature flags, and audit records.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://warehouse.urbanflow.local
    description: Environment warehouse service
security: []
tags:
  - name: Warehouses
    description: Warehouse and logistics-hub operations
  - name: Incidents
    description: Problem-delivery management
  - name: Feature flags
    description: Versioned operational feature switches
  - name: Audit
    description: Append-only operational audit history
paths:
  /api/v1/warehouses:
    get:
      tags: [Warehouses]
      summary: Search warehouses
      operationId: searchWarehouses
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, code, city, updatedAt]
            default: name
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Stable warehouse page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehousePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
    post:
      tags: [Warehouses]
      summary: Create a warehouse
      operationId: createWarehouse
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarehouse'
      responses:
        '201':
          $ref: '#/components/responses/Warehouse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/warehouses/{warehouseId}:
    get:
      tags: [Warehouses]
      summary: Read a warehouse
      operationId: getWarehouse
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
      responses:
        '200':
          $ref: '#/components/responses/Warehouse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Warehouses]
      summary: Update a warehouse
      operationId: updateWarehouse
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWarehouse'
      responses:
        '200':
          $ref: '#/components/responses/Warehouse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/warehouses/{warehouseId}/hubs:
    get:
      tags: [Warehouses]
      summary: List warehouse hubs
      operationId: listWarehouseHubs
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
      responses:
        '200':
          description: Hubs ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hub'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Warehouses]
      summary: Create a logistics hub
      operationId: createWarehouseHub
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHub'
      responses:
        '201':
          description: Hub created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hub'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/hubs/{hubId}/active:
    patch:
      tags: [Warehouses]
      summary: Change hub availability
      operationId: setHubActive
      parameters:
        - name: hubId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveState'
      responses:
        '200':
          description: Updated hub
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hub'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/incidents:
    get:
      tags: [Incidents]
      summary: List incidents by status
      operationId: listIncidents
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, RESOLVED]
            default: OPEN
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Incident page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
    post:
      tags: [Incidents]
      summary: Open a shipment incident
      operationId: openIncident
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncident'
      responses:
        '201':
          description: Incident opened
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/incidents/{incidentId}/resolve:
    post:
      tags: [Incidents]
      summary: Resolve an incident
      operationId: resolveIncident
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Resolved incident
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/feature-flags:
    get:
      tags: [Feature flags]
      summary: List feature flags
      operationId: listFeatureFlags
      responses:
        '200':
          description: Flags ordered by key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlag'
        '400':
          $ref: '#/components/responses/InvalidRequest'
    post:
      tags: [Feature flags]
      summary: Create a feature flag
      operationId: createFeatureFlag
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureFlag'
      responses:
        '201':
          description: Feature flag created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/feature-flags/{flagId}:
    patch:
      tags: [Feature flags]
      summary: Change a feature flag
      operationId: setFeatureFlag
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnabledState'
      responses:
        '200':
          description: Updated feature flag
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/audit-records:
    get:
      tags: [Audit]
      summary: List entity audit records
      operationId: listAuditRecords
      parameters:
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Newest-first audit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
components:
  parameters:
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated operator subject propagated by the gateway.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"v[0-9]+"$'
    Query:
      name: query
      in: query
      schema:
        type: string
        maxLength: 120
        default: ''
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    ETag:
      description: Strong optimistic entity version.
      schema:
        type: string
        pattern: '^"v[0-9]+"$'
  responses:
    Warehouse:
      description: Warehouse state
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Warehouse'
    InvalidRequest:
      description: Malformed or invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Entity does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    VersionConflict:
      description: Supplied version is stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PreconditionRequired:
      description: If-Match is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    CreateWarehouse:
      type: object
      additionalProperties: false
      required: [code, name, city, capacity]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9]{2,20}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 120
        capacity:
          type: integer
          minimum: 1
          maximum: 1000000
    UpdateWarehouse:
      type: object
      additionalProperties: false
      required: [name, city, capacity, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 120
        capacity:
          type: integer
          minimum: 1
          maximum: 1000000
        active:
          type: boolean
    CreateHub:
      type: object
      additionalProperties: false
      required: [name, city]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 120
    ActiveState:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
    CreateIncident:
      type: object
      additionalProperties: false
      required: [shipmentId, type, description]
      properties:
        shipmentId:
          type: string
          format: uuid
        type:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          minLength: 1
          maxLength: 1000
    CreateFeatureFlag:
      type: object
      additionalProperties: false
      required: [key, description, enabled]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9.-]{2,79}$'
        description:
          type: string
          minLength: 1
          maxLength: 300
        enabled:
          type: boolean
    EnabledState:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    Warehouse:
      type: object
      additionalProperties: false
      required: [id, code, name, city, capacity, active, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        city:
          type: string
        capacity:
          type: integer
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    Hub:
      type: object
      additionalProperties: false
      required: [id, warehouseId, name, city, active, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    Incident:
      type: object
      additionalProperties: false
      required: [id, shipmentId, type, description, status, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        shipmentId:
          type: string
          format: uuid
        type:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [OPEN, RESOLVED]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          format: int64
    FeatureFlag:
      type: object
      additionalProperties: false
      required: [id, key, description, enabled, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    AuditRecord:
      type: object
      additionalProperties: false
      required: [id, actorId, action, entityType, entityId, details, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        details:
          type: string
        occurredAt:
          type: string
          format: date-time
    WarehousePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Warehouse'
    IncidentPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Incident'
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditRecord'
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, status, path, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        path:
          type: string
        timestamp:
          type: string
          format: date-time
