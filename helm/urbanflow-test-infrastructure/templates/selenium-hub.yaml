apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urbanflow.fullname" . }}-selenium-hub
  namespace: {{ include "urbanflow.namespace" . }}
  labels:
    {{- include "urbanflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: selenium-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: selenium-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: selenium-hub
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: hub
          image: {{ .Values.images.hub | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: publish, containerPort: 4442 }
            - { name: subscribe, containerPort: 4443 }
            - { name: web, containerPort: 4444 }
          readinessProbe:
            httpGet: { path: /wd/hub/status, port: web }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /wd/hub/status, port: web }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.grid.hub.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urbanflow.fullname" . }}-selenium-hub
  namespace: {{ include "urbanflow.namespace" . }}
  labels:
    {{- include "urbanflow.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: selenium-hub
  ports:
    - { name: publish, port: 4442, targetPort: publish }
    - { name: subscribe, port: 4443, targetPort: subscribe }
    - { name: web, port: 4444, targetPort: web }
