{{- if .Values.test.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "urbanflow.fullname" . }}-test-{{ .Release.Revision }}
  namespace: {{ include "urbanflow.namespace" . }}
  labels:
    {{- include "urbanflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-runner
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ mul .Values.reports.retentionDays 86400 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: test-runner
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "urbanflow.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tests
          image: {{ .Values.images.testRunner | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --environment={{ .Values.test.environment }}
            - --suite={{ .Values.test.suite }}
            - --browser={{ .Values.test.browser }}
            - --headless=true
            - --parallelism={{ .Values.test.parallelism }}
            - --retries={{ .Values.test.retries }}
            - --remote-url=http://{{ include "urbanflow.fullname" . }}-selenium-hub:4444
            - --report-directory=/reports
            - --execute=true
          envFrom:
            - configMapRef: { name: {{ include "urbanflow.fullname" . }}-config }
            - secretRef: { name: {{ include "urbanflow.secretName" . }}, optional: true }
          volumeMounts:
            - { name: reports, mountPath: /reports }
          resources:
            {{- toYaml .Values.test.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: {{ include "urbanflow.fullname" . }}-reports
{{- end }}
