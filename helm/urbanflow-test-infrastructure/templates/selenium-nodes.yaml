{{- $root := . -}}
{{- range $browser, $node := .Values.grid.browsers }}
{{- if $node.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urbanflow.fullname" $root }}-selenium-{{ $browser }}
  namespace: {{ include "urbanflow.namespace" $root }}
  labels:
    {{- include "urbanflow.labels" $root | nindent 4 }}
    app.kubernetes.io/component: selenium-{{ $browser }}
spec:
  replicas: {{ $node.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: selenium-{{ $browser }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: selenium-{{ $browser }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: browser
          image: {{ index $root.Values.images $browser | quote }}
          imagePullPolicy: {{ $root.Values.images.pullPolicy }}
          env:
            - name: SE_EVENT_BUS_HOST
              value: {{ include "urbanflow.fullname" $root }}-selenium-hub
            - { name: SE_EVENT_BUS_PUBLISH_PORT, value: "4442" }
            - { name: SE_EVENT_BUS_SUBSCRIBE_PORT, value: "4443" }
            - { name: SE_NODE_MAX_SESSIONS, value: {{ $node.maxSessions | quote }} }
          readinessProbe:
            tcpSocket: { port: 5555 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5555 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $node.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "urbanflow.fullname" $root }}-selenium-{{ $browser }}
  namespace: {{ include "urbanflow.namespace" $root }}
  labels:
    {{- include "urbanflow.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "urbanflow.fullname" $root }}-selenium-{{ $browser }}
  minReplicas: {{ $node.minReplicas }}
  maxReplicas: {{ $node.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
{{- end }}
{{- end }}
