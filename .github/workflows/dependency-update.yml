name: Dependency update report
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-update
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Report dependency and plugin updates
        run: ./mvnw versions:display-dependency-updates versions:display-plugin-updates -DoutputFile=target/dependency-updates.txt
      - name: Validate current dependency graph
        run: ./mvnw -DskipTests verify
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-update-report
          retention-days: 30
          path: target/dependency-updates.txt
