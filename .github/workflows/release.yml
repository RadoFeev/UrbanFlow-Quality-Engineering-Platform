name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: azure/setup-helm@v5.0.1
      - name: Verify and package JVM artifacts
        run: ./mvnw -Pquality clean verify
      - name: Lint and package Helm chart
        run: |
          helm lint helm/urbanflow-test-infrastructure
          helm template urbanflow helm/urbanflow-test-infrastructure --values helm/urbanflow-test-infrastructure/values-minimal.yaml > target/helm-minimal.yaml
          helm package helm/urbanflow-test-infrastructure --destination target
      - name: Authenticate container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish service images
        env:
          IMAGE_REPOSITORY: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker compose -f infrastructure/compose.yml --profile minimal build
          docker compose -f infrastructure/compose.yml --profile minimal push
      - name: Produce checksums and release notes
        run: |
          find . -path '*/target/*.jar' -o -path 'target/*.tgz' | sort | xargs sha256sum > target/SHA256SUMS
          sed -n '/^## \[/,/^## \[/p' docs/CHANGELOG.md > target/RELEASE_NOTES.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: target/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            **/target/*-exec.jar
            target/*.tgz
            target/SHA256SUMS
            target/helm-minimal.yaml
