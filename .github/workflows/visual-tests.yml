name: Visual tests
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    uses: ./.github/workflows/_maven-suite.yml
    with:
      command: ./mvnw -pl :visual-tests -am -Dgroups=visual clean test
      artifact-name: visual-tests
      timeout-minutes: 25
      infrastructure-retry: true
