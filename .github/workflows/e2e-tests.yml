name: End-to-end tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Create ephemeral stack secrets
        shell: bash
        run: |
          echo "POSTGRES_USER=urbanflow" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "IDENTITY_SIGNING_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Package applications
        run: ./mvnw -DskipTests package
      - name: Start minimal stack
        run: docker compose -f infrastructure/compose.yml --profile minimal up -d --build --wait
      - name: Execute deployed journeys
        run: bash scripts/ci/run-with-infra-retry.sh "./mvnw -pl :e2e-tests -am -Dgroups=e2e -De2e.enabled=true -Didentity.url=http://localhost:8081 -Dshipment.url=http://localhost:8082 clean test"
      - name: Capture Compose logs
        if: always()
        run: docker compose -f infrastructure/compose.yml --profile minimal logs --no-color > target/compose-e2e.log
      - name: Stop stack
        if: always()
        run: docker compose -f infrastructure/compose.yml --profile minimal down --volumes --remove-orphans
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_attempt }}
          retention-days: 14
          path: |
            e2e-tests/target/surefire-reports/**
            e2e-tests/target/allure-results/**
            target/compose-e2e.log
            target/ci-attempts/**
