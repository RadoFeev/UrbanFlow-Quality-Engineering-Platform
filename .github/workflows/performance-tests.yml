name: Performance tests
on:
  schedule:
    - cron: "0 2 * * 2,5"
  workflow_dispatch:
    inputs:
      profile:
        description: k6 workload profile
        required: true
        default: smoke
        type: choice
        options: [smoke, load]
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: grafana/setup-k6-action@v1
      - name: Create ephemeral stack secrets
        run: |
          echo "POSTGRES_USER=urbanflow" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "IDENTITY_SIGNING_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Validate k6 contracts and package stack
        run: ./mvnw -pl :performance-tests -am -Dgroups=performance clean test package
      - name: Inspect k6 bundle
        run: k6 inspect performance-tests/k6/urbanflow.js
      - name: Start stack
        run: docker compose -f infrastructure/compose.yml --profile minimal up -d --build --wait
      - name: Run thresholds
        env:
          PROFILE: ${{ inputs.profile || 'smoke' }}
        run: k6 run --summary-export=target/k6-summary.json performance-tests/k6/urbanflow.js
      - name: Stop stack
        if: always()
        run: docker compose -f infrastructure/compose.yml --profile minimal down --volumes --remove-orphans
      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence-${{ github.run_attempt }}
          retention-days: 30
          path: |
            target/k6-summary.json
            performance-tests/target/surefire-reports/**
