name: Smoke tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    uses: ./.github/workflows/_maven-suite.yml
    with:
      command: ./mvnw -pl :ui-tests -am -Dgroups=ui -Dtest=CustomerAuthenticationUiTest clean test
      artifact-name: smoke-tests
      timeout-minutes: 20
      infrastructure-retry: true
