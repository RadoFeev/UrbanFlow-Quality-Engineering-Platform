version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 10
    groups:
      test-platform:
        patterns:
          - "org.seleniumhq.selenium:*"
          - "org.junit:*"
          - "org.assertj:*"
          - "org.awaitility:*"
          - "io.rest-assured:*"
          - "io.qameta.allure:*"
      test-infrastructure:
        patterns:
          - "org.testcontainers:*"
          - "org.wiremock:*"
          - "au.com.dius.pact.*:*"
    labels: ["dependencies", "java"]
    commit-message:
      prefix: "build"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Sofia
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
